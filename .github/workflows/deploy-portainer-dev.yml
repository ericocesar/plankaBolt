name: Deploy Portainer Dev

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: develop
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       (github.event.workflow_run.head_branch == 'bolt/develop' || github.event.workflow_run.head_branch == 'refs/heads/bolt/develop'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Portainer (Dev)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL_DEV }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY_DEV }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID_DEV }}
          STACK_NAME: ${{ secrets.STACK_NAME_DEV }}
          STACK_FILE_PATH: .github/infra/stack-dev.yml
        run: python3 scripts/deploy_portainer.py
