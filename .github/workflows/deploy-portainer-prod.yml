name: Deploy Portainer Prod

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       (github.event.workflow_run.head_branch == 'bolt/main' || github.event.workflow_run.head_branch == 'refs/heads/bolt/main'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Portainer (Prod)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL_PROD }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY_PROD }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID_PROD }}
          STACK_NAME: ${{ secrets.STACK_NAME_PROD }}
          STACK_FILE_PATH: .github/infra/stack-prod.yml
        run: python3 scripts/deploy_portainer.py
