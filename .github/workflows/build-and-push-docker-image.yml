name: Build and Push Docker Image

on:
  push:
    branches:
      - 'bolt/develop'
      - 'bolt/main'

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ericocesar/plankaBolt
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/bolt/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/bolt/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/bolt/develop'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Portainer (Dev)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL_DEV }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY_DEV }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID_DEV }}
          STACK_NAME: ${{ secrets.STACK_NAME_DEV }}
          STACK_FILE_PATH: ${{ secrets.STACK_FILE_PATH_DEV }}
        run: python3 scripts/deploy_portainer.py

  deploy-prod:
    needs: build-and-push
    if: github.ref == 'refs/heads/bolt/main'
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Portainer (Prod)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL_PROD }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY_PROD }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID_PROD }}
          STACK_NAME: ${{ secrets.STACK_NAME_PROD }}
          STACK_FILE_PATH: ${{ secrets.STACK_FILE_PATH_PROD }}
        run: python3 scripts/deploy_portainer.py
