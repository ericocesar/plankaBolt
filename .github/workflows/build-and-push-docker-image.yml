name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'bolt/develop'
      - 'bolt/main'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ github.ref == 'refs/heads/bolt/main' && secrets.DOCKER_USERNAME_PROD || secrets.DOCKER_USERNAME_DEV }}
          password: ${{ github.ref == 'refs/heads/bolt/main' && secrets.DOCKER_TOKEN_PROD || secrets.DOCKER_TOKEN_DEV }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ericocesar/plankaBolt
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/bolt/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/bolt/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

