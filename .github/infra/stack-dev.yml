version: "3.7"
services:
  planka_app:
    image: ericocesar/plankabolt:develop
    environment:
      <<: *variaveis
    networks:
      - interna ## Nome da rede interna

    volumes:
      - planka_avatars:/app/public/user-avatars
      - planka_backgrounds:/app/public/project-background-images
      - planka_attachments:/app/private/attachments

    ## 🔗 Configurar Webhook Global
    #- WEBHOOKS=[{
    #-   "url": "https://webhook.dominio.com",
    #-   "accessToken": "token_se_tiver",
    #-   "events": ["cardCreate", "cardUpdate", "cardDelete"],
    #-   "excludedEvents": ["notificationCreate", "notificationUpdate"]
    #- }]

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.planka.rule=Host(`proj.swdev.webck.com.br`)
        - traefik.http.services.planka.loadbalancer.server.port=1337
        - traefik.http.routers.planka.service=planka
        - traefik.http.routers.planka.tls.certresolver=letsencryptresolver
        - traefik.http.routers.planka.entrypoints=websecure
        - traefik.http.routers.planka.tls=true
        - traefik.docker.network=interna

  planka_redis:
    image: redis:latest ## Versão do Redis
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]

    volumes:
      - planka_redis:/data

    networks:
      - interna ## Nome da rede interna

    ## Descomente as linhas abaixo para uso externo
    #ports:
    #  - 6379:6379

    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

## --------------------------- ORION --------------------------- ##

volumes:
  planka_avatars:
    external: true
    name: planka_avatars
  planka_backgrounds:
    external: true
    name: planka_backgrounds
  planka_attachments:
    external: true
    name: planka_attachments
  planka_redis:
    external: true
    name: planka_redis

networks:
  interna: ## Nome da rede interna
    name: interna ## Nome da rede interna
    external: true
